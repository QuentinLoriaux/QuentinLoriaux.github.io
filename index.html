<script>const MESSAGES={title:"Unlockit",introduction:"Résolvez les énigmes pour révéler votre image chiffrée.",dropzone:{beforeFileName:"Choisissez un fichier ",fileName:".lockit",afterFileName:" ou faites-le glisser ici",},difficulty:"Difficulté : ",download:"Télécharger l'image",congratulations:"Félicitations ! Vous avez déverrouillé toute l'image.",blocksUnlocked:(unlocked,total)=>`${unlocked} bloc(s) sur ${total} déverrouillé(s).`,puzzlePrompt:(type,prompt,hint)=>`ÉNIGME ${type.toUpperCase()}\n\n${prompt}\n\nIndice : ${hint}`,incorrectAnswer:"Ce n'est pas la bonne réponse. Essayez encore.",invalidFile:"Impossible d'ouvrir ce fichier.",invalidHeader:"Ce fichier n'est pas un fichier Unlockit.",unknownDifficulty:"Le fichier contient une difficulté inconnue.",binarySignedConversionPrompt:(binary,notation)=>`Convertissez ${binary} (${notation}) en décimal.`,binarySignedEncodingPrompt:(value,notation)=>`Convertissez le nombre décimal ${value} en ${notation} sur 8 bits.`,binaryFloatConversionPrompt:(value)=>`Un flottant sur 16 bits est défini par S-E-M = 1-4-11, avec un biais d'exposant de 7. Convertissez ${value} en flottant.`,binaryFloatDecodingPrompt:(bits)=>`Un flottant sur 16 bits est défini par S-E-M = 1-4-11, avec un biais d'exposant de 7. Convertissez ${bits} en décimal.`,binaryFloatOperationPrompt:(first,second,operation)=>`Un flottant sur 16 bits est défini par S-E-M = 1-4-11, avec un biais d'exposant de 7. Calculez ${first} ${operation} ${second} et donnez le résultat sous forme de flottant.`,binaryGrayConversionPrompt:(value)=>`Écrivez ${value} en code Gray.`,binaryGrayDecodingPrompt:(bits)=>`Convertissez le code Gray ${bits} en décimal.`,binaryHint:"Pour les flottants, utilisez S E M avec des espaces et arrondissez la mantisse à 11 bits.",booleanPrompt:(expression,result)=>`${expression} = ${result} : vrai ou faux ?`,hardBooleanPrompt:(expression,result)=>`${expression} = ${result} : vrai ou faux ?`,booleanSimplificationPrompt:(expression,variables,form)= ationServerRoomPrompt:"Une salle serveur mesure la température, la fumée et l'état de la porte. Elle commande la climatisation, l'extinction automatique et une alarme. Quelles sont les entrées et les sorties ?",modelisationAnswerPrompt:(number,prompt,hint)=>`ÉNIGME DE MODÉLISATION\n\n${prompt}\n\n${number === 1 ? "Entrées" : "Sorties"} : saisissez les variables séparées par des virgules.\n\nIndice : ${hint}`,modelisationInputsLabel:"Entrées :",modelisationOutputsLabel:"Sorties :",modelisationValidate:"Valider",modelisationCancel:"Annuler",modelisationConveyorPrompt:"Une ligne de tri reçoit des capteurs de présence, de poids et d'arrêt d'urgence. Elle commande le moteur du tapis, un vérin de déviation et un voyant d'alarme. Quelles sont les entrées et les sorties ?",modelisationDronePrompt:"Un drone reçoit son altitude, la distance aux obstacles et l'état de sa batterie. Il commande quatre moteurs, une caméra et un signal de retour automatique. Quelles sont les entrées et les sorties ?",modelisationAccessPrompt:"Un contrôle d'accès reçoit un badge, un code valide, un capteur de porte et un bouton d'urgence. Il commande la serrure, un voyant d'accès et une sirène. Quelles sont les entrées et les sorties ?",modelisationHint:"Utilisez un seul mot par variable, avec les noms exacts indiqués dans l'énoncé. L'ordre et les espaces autour des virgules n'ont pas d'importance.",circuitsKarnaughPrompt:(expression,variables,form)=>`À l'aide d'une carte de Karnaugh (${variables} variables), simplifiez ${expression} sous forme ${form}.`,karnaughTruthTablePrompt:(table,form)=>`À partir de la table de vérité suivante, trouvez la forme ${form} de f :\n${table}`,circuitsImplementationPrompt:(expression,variables,form)=>`Réalisez cette fonction booléenne sous forme ${form} : f(${variables}) = ${expression}.`,karnaughHint:"Regroupez les 1 adjacents pour la forme SOP ou les 0 adjacents pour la forme POS ; utilisez A' pour représenter NON A.",};function createRandom(seed){let value=seed>>>0;return()=>{value=(value*1664525+1013904223)>>>0;return value/0x100000000;};}function binaryPadded(value,width){return value.toString(2).padStart(width,"0");}function randomInteger(random,minimum,maximum){return minimum+Math.floor(random()*(maximum-minimum+1));}function signedValue(bits,notation){const value=parseInt(bits,2);if(notation===0)return bits[0]==="1"?-(value&0x7f):value;if(notation===1)return bits[0]==="1"?-((value ^ 0xff)&0x7f):value;return bits[0]==="1"?-(0x100-value):value;}function encodeSignedBits(value,notation){if(value>=0)return binaryPadded(value,8);if(notation===0)return binaryPadded(0x80+Math.abs(value),8);if(notation===1)return binaryPadded((0xff-Math.abs(value))>>>0,8);return binaryPadded(0x100+value,8);}function floatBits(value){const sign=value<0?"1":"0";const magnitude=Math.abs(value);const exponent=Math.floor(Math.log2(magnitude));const fraction=magnitude/2**exponent-1;const mantissa=Math.round(fraction*2**11);return `${sign} ${binaryPadded(exponent + 7, 4)} ${binaryPadded(mantissa, 11)}`;}function floatValue(bits){const fields=bits.replace(/\s/g,"").match(/^([01])([01]{4})([01]{11})$/);if(!fields)throw new Error("Invalid floating-point value");const exponent=parseInt(fields[2],2)-7;return(fields[1]==="1"?-1:1)*2**exponent*(1+parseInt(fields[3],2)/2**11);}function decodeGrayValue(gray){let value=gray;for(let shifted=gray>>1;shifted;shifted>>=1)value ^=shifted;return value;}function encodeGrayValue(value){return value ^(value>>1);}function makeBinaryQuestion(kind,hard,seed=0){const random=createRandom(seed+(hard?0x10000:0));const signedBits=binaryPadded(randomInteger(random,0x80,0xbf),8);const signedNotation=randomInteger(random,0,2);const signedDecimal=randomInteger(random,-63,63);const firstFloat=randomInteger(random,5,15)/4;const secondFloat=randomInteger(random,2,10)/4;const operation=random()<0.5?"+":"x";const decimal=randomInteger(random,4,hard?32:24)/4;const grayValue=randomInteger(random,4,hard?15:11);const grayBits=binaryPadded(
